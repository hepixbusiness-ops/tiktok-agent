<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Vidéo motion</title>
<link rel="stylesheet" href="device.css">
<style>
@font-face{font-family:'Fraunces';font-style:italic;font-weight:500 600;src:url('fonts/Fraunces-italic-latin-var.woff2') format('woff2');}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:500 800;src:url('fonts/Fraunces-normal-latin-var.woff2') format('woff2');}
@font-face{font-family:'Inter';font-style:normal;font-weight:400 800;src:url('fonts/Inter-normal-latin-var.woff2') format('woff2');}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Inter',sans-serif;color:var(--ink);background:var(--clair1)}
#bgClair{position:absolute;inset:0;background:radial-gradient(ellipse 65% 45% at 50% 36%,var(--clair0) 0%,var(--clair1) 45%,var(--clair2) 100%)}
#halo{position:absolute;width:1400px;height:1400px;left:-160px;top:-260px;border-radius:50%;background:radial-gradient(closest-side,var(--halo),transparent)}
#bgSombre{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 42%,var(--sombre0) 0%,var(--sombre1) 50%,var(--sombre2) 100%)}
#bgSombre:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 75% 18%,var(--halo),transparent 45%)}
#dust{position:absolute;inset:0}#dust i{position:absolute;border-radius:50%;background:var(--accentClair)}
#scene{position:absolute;inset:0;transform-origin:50% 45%}
.sc{position:absolute;inset:0;visibility:hidden}
.abs{position:absolute}
.F{font-family:'Fraunces',serif;font-weight:800;letter-spacing:-.04em;line-height:.95;white-space:nowrap;font-variation-settings:'opsz' 144;color:var(--ink)}
.F i{font-style:italic;font-weight:600;color:var(--accent);letter-spacing:-.025em}
.cr .F,.cr.F{color:var(--clair0)}.cr .F i,.cr.F i{color:var(--accentClair)}
.w{display:inline-block;transform-origin:50% 70%}
.chip{display:inline-flex;align-items:center;gap:16px;background:#fff;color:var(--ink);font:800 42px 'Inter';letter-spacing:-.005em;border-radius:100px;padding:16px 34px 16px 16px;white-space:nowrap;box-shadow:0 24px 44px -20px var(--ombre),0 0 0 1px var(--trait)}
.chip .d{width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.tag{display:inline-flex;align-items:center;gap:14px;background:var(--ink);color:#fff;font:800 30px 'Inter';letter-spacing:.14em;text-transform:uppercase;border-radius:100px;padding:16px 30px;white-space:nowrap}
.tag b{color:var(--accentClair)}
.nd{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 20px 40px -18px var(--ombre),0 0 0 4px var(--trait2)}
.nd b{font:800 72px 'Fraunces';color:var(--accent);font-style:italic}
.ndl{position:absolute;font:800 50px/1.1 'Inter';letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.fl{position:absolute;width:8px;border-radius:4px;transform-origin:50% 0}
.btn{display:inline-flex;align-items:center;gap:22px;background:var(--accent);color:#fff;font:800 56px 'Inter';letter-spacing:-.01em;border-radius:34px;padding:30px 52px 30px 30px;white-space:nowrap;box-shadow:0 36px 70px -24px var(--ombreForte),inset 0 1px 0 rgba(255,255,255,.3)}
.btn .ic{width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
#ring{position:absolute;border-radius:40px;border:4px solid var(--accent)}
.logoRow{display:flex;align-items:center;gap:22px}
.logoRow .lg{width:110px;height:110px;border-radius:28px;overflow:hidden;box-shadow:0 24px 40px -18px var(--ombre)}
.logoRow .lg img,.logoRow .lg svg{width:100%;height:100%;display:block}
.logoRow b{font:800 72px 'Inter';letter-spacing:-.03em;color:var(--ink)}.logoRow b em{font-style:normal;color:var(--accent)}
#sub{position:absolute;left:0;right:0;top:1560px;display:flex;justify-content:center;pointer-events:none;z-index:30}
#subIn{background:rgba(255,255,255,.97);border-radius:26px;box-shadow:0 18px 40px -20px rgba(0,0,0,.45);text-align:center;font:800 54px/1.25 'Inter';letter-spacing:-.01em;white-space:nowrap;padding:14px 22px;color:var(--ink)}
#subIn span{display:inline-block;margin:0 .1em;padding:0 .14em;border-radius:12px}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 45%,transparent 55%,rgba(0,0,0,.18) 100%)}
#grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.07}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
/* mur de captures */
.murIn{position:absolute;left:50%;top:50%;width:1560px;height:2600px;margin:-1300px 0 0 -780px;display:flex;gap:44px;justify-content:center}
.murCol{width:440px;display:flex;flex-direction:column;gap:44px}
.murCol div{height:800px;border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 40px 70px -30px var(--ombreForte),0 0 0 1px var(--trait)}
.murCol img{width:100%;display:block}
.voile{position:absolute;left:0;right:0;top:0;height:720px;background:linear-gradient(var(--clair0) 0%,var(--clair0) 40%,transparent)}
/* bandeau des métiers */
.rang{position:absolute;left:0;white-space:nowrap;display:flex;gap:22px}
.rang .chip{font-size:40px}
.rang .chip .d{background:var(--accentClair)}
/* notifications */
.lock{position:absolute;inset:0;background:linear-gradient(160deg,var(--sombre0),var(--sombre2));color:#fff;text-align:center}
.lock .h{font:600 96px/1 'Inter';letter-spacing:-.03em;margin-top:110px}
.lock .dt{font:600 20px 'Inter';opacity:.8;margin-top:8px}
.notif{position:absolute;left:14px;right:14px;display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.88);color:#1c1917;border-radius:22px;padding:14px;text-align:left;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.notif .ic{width:40px;height:40px;border-radius:10px;overflow:hidden;flex:none}.notif .ic svg{width:100%;height:100%}
.notif .t1{font:700 15px 'Inter';display:flex;justify-content:space-between;width:100%}.notif .t1 small{font:500 13px 'Inter';opacity:.6}
.notif .t2{font:600 17px/1.25 'Inter';margin-top:2px}.notif .t3{font:500 15px/1.25 'Inter';opacity:.75;margin-top:2px}
</style></head><body>
<div id="stage">
 <div id="bgClair"><div id="halo"></div></div>
 <div id="bgSombre"><div id="dust"></div></div>
 <div id="scene"></div>
 <div id="vig"></div>
 <div id="flash"></div>
 <div id="sub"><div id="subIn"></div></div>
 <canvas id="grain" width="540" height="960"></canvas>
</div>
<script src="device.js"></script>
<script>
/* Modèle de vidéo animée piloté par window.DATA et seek(t) (aucune animation temps réel).
   DATA = { duree, theme:{...}, marque, lien, logo, scenes:[{type,t0,t1,sombre,...}], mots:[[debut,fin,texte,scene]] } */
const D=window.DATA,W=1080,H=1920;window.DURATION=D.duree;
const $=s=>document.querySelector(s),ST=$('#stage'),SC=$('#scene');
for(const [k,v] of Object.entries(D.theme))ST.style.setProperty('--'+k,v);
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),L=(a,b,x)=>a+(b-a)*x,R=(t,a,d)=>cl((t-a)/d);
function bez(x1,y1,x2,y2){const A=(a,b)=>1-3*b+3*a,B=(a,b)=>3*b-6*a,C=a=>3*a;const cv=(t,a,b)=>((A(a,b)*t+B(a,b))*t+C(a))*t,sl=(t,a,b)=>3*A(a,b)*t*t+2*B(a,b)*t+C(a);
 return x=>{if(x<=0)return 0;if(x>=1)return 1;let t=x;for(let i=0;i<8;i++){const s=sl(t,x1,x2);if(Math.abs(s)<1e-6)break;t-=(cv(t,x1,x2)-x)/s;}return cv(cl(t),y1,y2);};}
const E=bez(.16,1,.3,1),SP=x=>x<=0?0:1-Math.exp(-6.5*x)*Math.cos(9.2*x);
const nz=(t,s)=>Math.sin(t*1.31+s)*.6+Math.sin(t*2.17+s*2.3)*.3+Math.sin(t*3.71+s*.7)*.1;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const vis=(el,o)=>{el.style.opacity=o.toFixed(3);el.style.visibility=o>0.002?'visible':'hidden';};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
/* « *mot* » = mot en italique couleur accent ; chaque mot devient un .w animable */
const words=l=>esc(l).split(/(\*[^*]+\*)/).filter(Boolean).map(p=>p.startsWith('*')?p.slice(1,-1).split(' ').map(w=>`<i class="w">${w}</i>`).join(' '):p.trim().split(/\s+/).filter(Boolean).map(w=>`<span class="w">${w}</span>`).join(' ')).join(' ');
function fit(el,max,min,width){width=Math.min(width,(el.parentElement&&el.parentElement.clientWidth)||width);for(let s=max;s>=min;s-=4){el.style.fontSize=s+'px';if(el.scrollWidth<=width)return s;}return min;}
/* entrées / sorties */
function rise(el,lt,a,o={}){const k=E(R(lt,a,o.d??.5));const op=cl(R(lt,a,.14));const bl=(1-cl(R(lt,a,.2)))*8;vis(el,op);el.style.transform=`translateY(${(1-k)*(o.dy??70)}px)`;el.style.filter=bl>.05?`blur(${bl.toFixed(1)}px)`:'none';}
function slam(el,lt,a,o={}){const k=SP(R(lt,a,o.d??.32));vis(el,cl(R(lt,a,.06)));el.style.transform=`scale(${L(o.from??1.5,1,k).toFixed(4)})`;}
function pop(el,lt,a,o={}){const k=SP(R(lt,a,o.d??.45));vis(el,cl(R(lt,a,.06)));el.style.transform=`scale(${Math.max(.01,k).toFixed(4)})`;}
const CHK='<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const LIEN='<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
/* bloc titre (lignes « *accent* ») centré à gauche, taille ajustée à la largeur */
function titre(par,lignes,y,o={}){const b=document.createElement('div');b.className='abs'+(o.cr?' cr':'');b.style.left='90px';b.style.top=y+'px';b.style.width='900px';
 const ls=lignes.map(l=>{const e=document.createElement('div');e.className='F';e.innerHTML=words(l);b.appendChild(e);return e;});par.appendChild(b);
 const size=Math.min(...ls.map(e=>fit(e,o.max??150,o.min??64,900)));ls.forEach(e=>{e.style.fontSize=size+'px';e.style.marginBottom=(size*.06)+'px';});
 return {b,ls,ws:[...b.querySelectorAll('.w')],h:b.offsetHeight};}
function anim(T,lt,a,mode){T.ws.forEach((w,i)=>{const st=a+i*.07;if(mode==='slam')slam(w,lt,st);else rise(w,lt,st,{dy:60});});}
/* ---------- construction des scènes ---------- */
const SCN=D.scenes.map((s,i)=>{const el=document.createElement('div');el.className='sc';SC.appendChild(el);const o={s,el,i,dur:s.t1-s.t0};
 if(s.type==='accroche'){o.T=titre(el,s.lignes,0,{cr:true,max:200,min:90});o.T.b.style.top=(860-o.T.h/2)+'px';}
 else if(s.type==='grand'){o.T=titre(el,[s.valeur],0,{cr:true,max:280,min:110});o.T.b.style.top='640px';o.T.ls[0].style.textAlign='center';o.T.b.style.left='60px';o.T.b.style.width='960px';
  if(s.label){o.L=titre(el,[s.label],0,{cr:true,max:96,min:56});o.L.b.style.top=(660+o.T.h+20)+'px';}}
 else if(s.type==='telephone'){o.T=titre(el,s.titre,170,{max:130,min:70});
  o.ph=HD.phone(el,{statusBg:s.statusBg||'#ffffff'});const im=document.createElement('img');im.src=s.image;im.style.cssText='position:absolute;left:0;top:0;width:100%;display:block';o.ph.content.appendChild(im);o.im=im;
  o.chips=(s.puces||[]).slice(0,2).map((p,k)=>{const c=document.createElement('div');c.className='chip abs';c.innerHTML=`<span class="d">${CHK}</span>${esc(p)}`;el.appendChild(c);return c;});}
 else if(s.type==='points'){o.T=titre(el,s.titre,200,{max:140,min:70});const y0=Math.max(700,260+o.T.h+120);
  o.chips=(s.puces||[]).slice(0,4).map((p,k)=>{const c=document.createElement('div');c.className='chip abs';c.innerHTML=`<span class="d">${CHK}</span>${esc(p)}`;el.appendChild(c);fit(c,52,30,900);c.style.left='90px';c.style.top=(y0+k*175)+'px';return c;});}
 else if(s.type==='etapes'){o.T=titre(el,s.titre,200,{max:140,min:70});const y0=Math.max(760,260+o.T.h+150),n=Math.min(4,(s.etapes||[]).length),gap=n>3?200:250;
  o.f1=document.createElement('div');o.f1.className='fl';o.f1.style.cssText+=`left:186px;top:${y0}px;height:${(n-1)*gap}px;background:var(--trait2)`;el.appendChild(o.f1);
  o.f2=document.createElement('div');o.f2.className='fl';o.f2.style.cssText+=`left:186px;top:${y0}px;height:${(n-1)*gap}px;background:var(--accent)`;el.appendChild(o.f2);
  o.nds=s.etapes.slice(0,n).map((e,k)=>{const nd=document.createElement('div');nd.className='nd';nd.style.left='190px';nd.style.top=(y0+k*gap)+'px';nd.innerHTML=`<b>${k+1}</b>`;el.appendChild(nd);
   const l=document.createElement('div');l.className='ndl';l.textContent=e;el.appendChild(l);fit(l,62,36,680);l.style.left='300px';l.style.top=(y0+k*gap-l.offsetHeight/2)+'px';return {nd,l};});}
 else if(s.type==='mur'){const m=document.createElement('div');m.className='murIn';const imgs=s.images.length?s.images:[s.image];
  o.cols=[0,1,2].map(c=>{const col=document.createElement('div');col.className='murCol';for(let r=0;r<4;r++){const d=document.createElement('div');d.innerHTML=`<img src="${imgs[(c*4+r)%imgs.length]}">`;col.appendChild(d);}m.appendChild(col);return col;});
  o.m=m;el.appendChild(m);const v=document.createElement('div');v.className='voile';el.appendChild(v);o.T=titre(el,s.titre,170,{max:140,min:70});}
 else if(s.type==='carrousel'){o.T=titre(el,s.titre,170,{max:130,min:70});const imgs=s.images;
  o.phs=[0,1,2].map(j=>{const ph=HD.phone(el,{statusBg:'#ffffff'});const im=document.createElement('img');im.src=imgs[j%imgs.length];im.style.cssText='position:absolute;left:0;top:0;width:100%;display:block';ph.content.appendChild(im);ph.im=im;return ph;});
  [o.phs[0],o.phs[2],o.phs[1]].forEach((ph,z)=>{ph.rig.style.zIndex=z+1;ph.shadow.style.zIndex=0;});}
 else if(s.type==='navigateur'){o.T=titre(el,s.titre,170,{max:130,min:70});o.br=HD.browser(el,{url:D.lien,width:1152});const im=document.createElement('img');im.src=s.image;o.br.content.appendChild(im);
  o.chips=(s.puces||[]).slice(0,2).map(p=>{const c=document.createElement('div');c.className='chip abs';c.innerHTML=`<span class="d">${CHK}</span>${esc(p)}`;el.appendChild(c);return c;});}
 else if(s.type==='metiers'){o.T=titre(el,s.titre,200,{max:140,min:70});const ms=s.metiers;
  o.rangs=[0,1,2,3].map(r=>{const d=document.createElement('div');d.className='rang';d.style.top=(720+r*170)+'px';const liste=[...ms.slice(r%ms.length),...ms.slice(0,r%ms.length)];d.innerHTML=[...liste,...liste,...liste].map(m=>`<span class="chip"><span class="d">${CHK}</span>${esc(m)}</span>`).join('');el.appendChild(d);d.dataset.w=d.scrollWidth/3;return d;});}
 else if(s.type==='notification'){o.T=titre(el,s.titre,170,{max:130,min:70});o.ph=HD.phone(el,{statusBg:'transparent',statusFg:'#fff',overlayStatus:true});
  const lk=document.createElement('div');lk.className='lock';lk.innerHTML='<div class="h">9:41</div><div class="dt">aujourd\'hui</div>';o.ph.content.appendChild(lk);
  o.ns=(s.notifications||[]).slice(0,3).map((n,j)=>{const d=document.createElement('div');d.className='notif';d.innerHTML=`<div class="ic">${D.logo}</div><div style="flex:1"><div class="t1">${esc(D.marqueTexte)}<small>maintenant</small></div><div class="t2">${esc(n.titre)}</div><div class="t3">${esc(n.texte)}</div></div>`;lk.appendChild(d);return d;});}
 else if(s.type==='cta'){o.lg=document.createElement('div');o.lg.className='logoRow abs';o.lg.style.left='90px';o.lg.style.top='200px';o.lg.innerHTML=`<div class="lg">${D.logo}</div><b>${D.marqueHtml}</b>`;el.appendChild(o.lg);
  o.T=titre(el,s.titre,400,{max:170,min:72});
  o.bw=document.createElement('div');o.bw.className='abs';o.bw.style.left='90px';o.bw.style.top=(400+o.T.h+90)+'px';o.bw.innerHTML=`<div id="ring"></div><span class="btn"><span class="ic">${LIEN}</span>${esc(D.lien)}</span>`;el.appendChild(o.bw);
  o.btn=o.bw.querySelector('.btn');o.ring=o.bw.querySelector('#ring');
  if(s.image){o.ph=HD.phone(el,{statusBg:s.statusBg||'#ffffff'});const im=document.createElement('img');im.src=s.image;im.style.cssText='position:absolute;left:0;top:0;width:100%;display:block';o.ph.content.appendChild(im);}
  if(s.mention){o.m=document.createElement('div');o.m.className='abs';o.m.style.left='90px';o.m.style.top=(400+o.T.h+290)+'px';o.m.innerHTML=`<span class="tag">${esc(s.mention)}</span>`;el.appendChild(o.m);}}
 return o;});
/* décor : poussières, grain */
(()=>{const r=rng(11),d=$('#dust');for(let i=0;i<40;i++){const e=document.createElement('i');const z=r();e.dataset.x=r()*W;e.dataset.y=r()*H;e.dataset.p=r()*6.28;e.dataset.z=z;const sz=2+z*6;e.style.width=e.style.height=sz+'px';e.style.opacity=(.12+.3*r()).toFixed(2);if(z>.6)e.style.filter=`blur(${((z-.6)*6).toFixed(1)}px)`;d.appendChild(e);}})();
const GR=[];(()=>{const g=$('#grain').getContext('2d');for(let k=0;k<5;k++){const im=g.createImageData(540,960),r=rng(100+k);for(let i=0;i<im.data.length;i+=4){const v=170+r()*85;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}GR.push(im);}})();
/* sous-titres : groupes de 5 mots max, le mot prononcé est surligné */
const MOTS=D.mots||[],GROUPES=[];(()=>{let g=[];MOTS.forEach((m,i)=>{const prev=MOTS[i-1];if(g.length&&(g.length>=5||m[3]!==prev[3]||/[.!?]$/.test(prev[2])||m[0]-prev[1]>.45)){GROUPES.push(g);g=[];}g.push(i);});if(g.length)GROUPES.push(g);})();
let gCour=-1;
function soustitres(t){const sb=$('#sub'),si=$('#subIn');let c=-1;for(let k=0;k<GROUPES.length;k++)if(t>=MOTS[GROUPES[k][0]][0]-.08)c=k;
 if(c<0){vis(sb,0);return;}const g=GROUPES[c],fin=MOTS[g[g.length-1]][1]+.35;
 if(c!==gCour){gCour=c;si.innerHTML=g.map(i=>`<span>${esc(MOTS[i][2])}</span>`).join(' ');fit(si,54,34,960);}
 [...si.children].forEach((sp,j)=>{const m=MOTS[g[j]];const on=t>=m[0]-.03&&t<m[1]+.05;sp.style.background=on?'var(--accent)':'transparent';sp.style.color=on?'#fff':'var(--ink)';});
 const st=MOTS[g[0]][0]-.08;const op=cl(R(t,st,.06))*(1-R(t,fin,.15));vis(sb,op);sb.style.transform=`translateY(${(1-E(R(t,st,.25)))*20}px)`;}
/* ---------- seek ---------- */
window.seek=async function(t){
 const cur=SCN.findIndex(o=>t>=o.s.t0&&t<o.s.t1);const k=cur<0?SCN.length-1:cur;
 /* fond sombre/clair en fondu sur 0,35 s autour de chaque changement */
 let sombre=0;SCN.forEach(o=>{const a=o.s.t0,b=o.s.t1;const v=o.s.sombre?cl(R(t,a-.2,.35))*(1-cl(R(t,b-.15,.35))):0;sombre=Math.max(sombre,v);});
 if(SCN[0].s.sombre&&t<.2)sombre=1;
 $('#bgSombre').style.opacity=sombre.toFixed(3);
 [...$('#dust').children].forEach(e=>{const z=+e.dataset.z,p=+e.dataset.p;e.style.transform=`translate(${(+e.dataset.x+nz(t*.3,p)*40*(1+z)).toFixed(1)}px,${((+e.dataset.y-t*14*(.4+z))%H+H)%H}px)`;});
 $('#halo').style.transform=`translate(${nz(t*.25,1)*60}px,${nz(t*.2,2)*40}px)`;
 SCN.forEach(o=>{const lt=t-o.s.t0,on=t>=o.s.t0-.05&&t<o.s.t1+.3;o.el.style.visibility=on?'visible':'hidden';if(!on)return;
